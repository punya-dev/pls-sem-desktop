name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Installer (.exe & .msi)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Build Backend Standalone Sidecar (PyInstaller)
        working-directory: backend
        run: |
          pyinstaller --clean -y pyinstaller.spec

      - name: Stage Sidecar Binary for Tauri
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Copy-Item backend/dist/statsem-backend.exe src-tauri/binaries/statsem-backend-x86_64-pc-windows-msvc.exe -Force
          Write-Host "Sidecar binary staged successfully:"
          Get-Item src-tauri/binaries/statsem-backend-x86_64-pc-windows-msvc.exe

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI Dependencies
        run: |
          npm install

      - name: Build Tauri Windows Bundle
        run: |
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: StatSEM-Windows-Installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Create Release and Upload Assets (Tags Only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
